    vendor_evidence: [AngelList Stack, Republic]

  - id: B3-DOM-01
    candidate: EQUITY-COMP-PLATFORM domain
    rationale: >-
      Covers the multi-master overlap between CAP-TABLE and COMP-MGMT specifically for

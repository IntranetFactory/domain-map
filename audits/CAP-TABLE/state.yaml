      CAP-TABLE-EMPLOYEE-PORTAL.
    vendor_evidence: [Shareworks, J.P. Morgan Workplace Solutions, Carta]

  - id: B3-MOD-04
    candidate: CAP-TABLE-COMPLIANCE module
    rationale: >-
      B3-CAND-11 beneficial_owners + kyc_records is a distinct compliance workflow likely

    vendor_evidence: [FinCEN regulatory framework, Carta]

  - id: B3-MOD-05
    candidate: CAP-TABLE-BOARD-CONSENTS module
    rationale: >-
      B3-CAND-05 board_consents + B3-CAND-12 voting_records. Could also live as a

    vendor_evidence: [FinCEN regulatory framework, Carta]

  - id: B3-REG-06
    candidate: SEC Reg CF regulation
    rationale: >-
      Crowdfunding exemption, for cap-tables with Reg CF investors. Relevant to AngelList

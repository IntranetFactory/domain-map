    vendor_evidence: [Ledgy, Vestd]

  - id: B3-REG-04
    candidate: VSOP (DE Virtuelle Stock Option Plan) regulation
    rationale: >-
      Ledgy's core market; DE phantom-share scheme.
    vendor_evidence: [Ledgy]

  - id: B3-REG-05
    candidate: FinCEN Corporate Transparency Act regulation
    rationale: >-
      US beneficial-ownership reporting, 2024-effective. Couples with B3-CAND-11

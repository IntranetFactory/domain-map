b3:
  - id: B3-CAND-01
    candidate: safe_notes
    rationale: >-
      Carta, AngelList Stack, Pulley all model SAFEs (Simple Agreement for Future Equity)
      as first-class instruments distinct from equity_grants and security_classes. Y
      Combinator post-money SAFE is the dominant pre-priced-round US instrument; no SAFE
      entity exists today, conversion mechanics live nowhere.
    vendor_evidence: [Carta, AngelList Stack, Pulley]
    proposed_module: new master in CAP-TABLE-LEDGER or new module CAP-TABLE-CONVERTIBLES

  - id: B3-CAND-02
    candidate: convertible_notes
    rationale: >-
      Carta, Pulley, Ledgy model convertible notes as a distinct instrument (debt that
      converts on a qualified financing). Different conversion math from SAFEs, different
      cap / discount mechanics, different accrued-interest tracking.
    vendor_evidence: [Carta, Pulley, Ledgy]
    proposed_module: new master in CAP-TABLE-LEDGER or new module CAP-TABLE-CONVERTIBLES

  - id: B3-CAND-03
    candidate: warrants
    rationale: >-
      Carta, AngelList model warrants as a separate instrument (often issued to vendors,
      banks, lenders, and early commercial partners). Currently security_classes might be
      stretched to cover, but vesting / exercise economics differ.
    vendor_evidence: [Carta, AngelList Stack]
    proposed_module: new master in CAP-TABLE-LEDGER or new module CAP-TABLE-CONVERTIBLES

  - id: B3-CAND-04
    candidate: tax_form_records
    rationale: >-
      Carta, Shareworks both generate Form 3921 (ISO exercise) and Form 3922 (ESPP
      purchase) annually, plus Form 1099-B / 1099-NEC for NQSO cash exercises. Currently no
      tax-form record entity, the annual-filing surface is opaque. (Form 3921 / 3922
      regulations themselves are now attached as of 2026-06-07.)
    vendor_evidence: [Carta, Shareworks]
    proposed_module: new master in CAP-TABLE-VALUATIONS or new module CAP-TABLE-TAX-REPORTING

  - id: B3-CAND-05
    candidate: board_consents
    rationale: >-
      Carta, Pulley, Shoobx (Fidelity) all model board consents (written / meeting) as
      first-class records for grant issuance, repricing, and pool refreshes. The CAP-TABLE
      state machine has approved states but no record of which board action approved them.
    vendor_evidence: [Carta, Pulley, Shoobx]
    proposed_module: new master in CAP-TABLE-LEDGER or new module CAP-TABLE-BOARD-CONSENTS

  - id: B3-CAND-06
    candidate: share_certificates
    rationale: >-
      Carta, Pulley, Ledgy issue digital share certificates with QR codes and DLT-anchored
      proofs (Astrella, Shoobx particularly heavy here). Currently no certificate entity,
      shareholder_records is the closest but conflates legal-record-of-ownership with the
      certificate itself.
    vendor_evidence: [Carta, Pulley, Ledgy, Astrella, Shoobx]
    proposed_module: new master in CAP-TABLE-LEDGER

  - id: B3-CAND-07
    candidate: espp_records
    rationale: >-
      Shareworks, J.P. Morgan Workplace Solutions, Carta all run ESPP (Employee Stock
      Purchase Plans) with per-offering enrollment, payroll withholding, purchase events,
      and qualifying / disqualifying holding-period tracking. Currently no ESPP entity, the
      program-level shape is opaque.
    vendor_evidence: [Shareworks, J.P. Morgan Workplace Solutions, Carta]
    proposed_module: new master in CAP-TABLE-EMPLOYEE-PORTAL or new module CAP-TABLE-ESPP

  - id: B3-CAND-08
    candidate: handoff_asc718_expense_period_closed_to_gl_journal_entries
    rationale: >-
      Carta and Pulley both push monthly stock-based-comp expense to the general ledger;
      absent from current handoff set. Implied outbound CAP-TABLE -> FIN handoff on
      asc718_expense_period.closed (the asc718_expense_periods 'closed' lifecycle state now
      exists as of 2026-06-07, so the source-side anchor is present).
    vendor_evidence: [Carta, Pulley]
    proposed_module: inserted as a handoff, not a new entity

  - id: B3-CAND-09
    candidate: signature_records_handoffs_to_cap_table
    rationale: >-
      Carta, Pulley, Shoobx, AngelList Stack all wire DocuSign / native e-signature for
      grant acceptance and board consent. Currently no ESIGN handoff or cross-relationship
      row references CAP-TABLE.
    vendor_evidence: [Carta, Pulley, Shoobx, AngelList Stack]
    proposed_module: inserted as handoffs + cross-relationships, not a new entity

  - id: B3-CAND-10
    candidate: phantom_shares_sar_grants_profits_interests
    rationale: >-
      Ledgy (VSOP for DE), Carta (US phantom-equity), Shareworks (profits interests for
      LLC). Currently equity_grants conflates all instrument types; profits-interest LLC
      mechanics differ enough to warrant a separate entity.
    vendor_evidence: [Ledgy, Carta, Shareworks]
    proposed_module: optional new master in CAP-TABLE-GRANTS or new module CAP-TABLE-ALT-EQUITY

  - id: B3-CAND-11
    candidate: beneficial_owners_kyc_records
    rationale: >-
      FinCEN beneficial-ownership reporting (Corporate Transparency Act 2024) requires
      cap-table issuers to maintain a beneficial-owner record distinct from
      shareholder_records. AML / KYC checks at secondary-transaction time map to a
      per-holder KYC record.
    vendor_evidence: [FinCEN regulatory framework]
    proposed_module: new master in CAP-TABLE-LEDGER or new module CAP-TABLE-COMPLIANCE

  - id: B3-CAND-12
    candidate: voting_records_proxy_records
    rationale: >-
      Carta, AngelList model annual / extraordinary shareholder votes (M&A consents,
      charter amendments, written consents in lieu of meeting). Currently no voting-record
      entity.
    vendor_evidence: [Carta, AngelList Stack]
    proposed_module: optional new master in CAP-TABLE-BOARD-CONSENTS

  - id: B3-MOD-01
    candidate: CAP-TABLE-CONVERTIBLES module
    rationale: >-
      If safe_notes / convertible_notes / warrants get loaded (B3-CAND-01/02/03), a 7th
      module for the convertibles slice makes more sense than overloading
      CAP-TABLE-LEDGER.
    vendor_evidence: [Carta, Pulley, AngelList Stack, Ledgy]

  - id: B3-MOD-02
    candidate: CAP-TABLE-TAX-REPORTING module
    rationale: >-
      B3-CAND-04 tax_form_records + B3-CAND-08 ASC 718 -> FIN handoff belong together;
      pair with CAP-TABLE-VALUATIONS as a sibling.
    vendor_evidence: [Carta, Shareworks, Pulley]

  - id: B3-MOD-03
    candidate: CAP-TABLE-ESPP module
    rationale: >-
      B3-CAND-07 espp_records is a sufficiently distinct workflow (offering periods +

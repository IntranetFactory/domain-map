b1a:
  - id: B1A-COPY-DOMAIN
    summary: Write the approved catalog copy for Transportation Management System.
    finding: >-
      catalog_tagline and catalog_description are empty (A4 or M8, Rule #20). The wording is drafted
      and waits for approval.
    action: >-
      Write these two values once approved, or the user's correction, at record_status='new'. Fill
      empty columns only.
    extra_rows:
      - table: domains
        natural_key: TMS
        field: catalog_tagline
        to: >-
          Buy freight with control: source carriers, tender shipments, track deliveries, and catch
          invoice errors before you pay.
      - table: domains
        natural_key: TMS
        field: catalog_description
        to: >-
          Run your freight from one place. Bid lanes out to carriers, keep agreements and rates
          current, turn orders into shipments, and tender them to the right carrier at the
          contracted price. Follow every shipment to delivery and keep the paperwork, from bills of
          lading to consignment notes, attached to it.


          When invoices arrive, check them against the shipment and the agreed rate, resolve
          disputes with the carrier, and send only approved charges to accounts payable. File claims
          for loss or damage on time, and book dock appointments so trucks arrive when your team is
          ready.
  - id: B1A-COPY-TMS-SHIPMENTS
    summary: Write the approved catalog copy for Freight Shipment Execution.
    finding: >-
      catalog_tagline and catalog_description are empty (A4 or M8, Rule #20). The wording is drafted
      and waits for approval.
    action: >-
      Write these two values once approved, or the user's correction, at record_status='new'. Fill
      empty columns only.
    extra_rows:
      - table: domain_modules
        natural_key: TMS-SHIPMENTS
        field: catalog_tagline
        to: >-
          Turn orders into shipments, tender them to carriers, and track them through delivery with
          the paperwork attached.
      - table: domain_modules
        natural_key: TMS-SHIPMENTS
        field: catalog_description
        to: >-
          Bring in freight demand from purchase, sales, or transfer orders, and plan it into
          shipments. Compare carriers against your contracted rates, offer the tender, and see who
          accepted. Follow each shipment through pickup, transit, and delivery, whichever feed
          reports the status.


          Produce bills of lading and consignment notes, and keep hazardous materials and food
          transport records with the shipment they belong to.
  - id: B1A-COPY-TMS-CARRIER-RATES
    summary: Write the approved catalog copy for Carrier Rate and Contract Management.
    finding: >-
      catalog_tagline and catalog_description are empty (A4 or M8, Rule #20). The wording is drafted
      and waits for approval.
    action: >-
      Write these two values once approved, or the user's correction, at record_status='new'. Fill
      empty columns only.
    extra_rows:
      - table: domain_modules
        natural_key: TMS-CARRIER-RATES
        field: catalog_tagline
        to: >-
          Keep your approved carriers, agreements, and contracted rates in one place that planning
          and audit can trust.
      - table: domain_modules
        natural_key: TMS-CARRIER-RATES
        field: catalog_description
        to: >-
          Maintain the list of carriers you may tender to, with their modes, service area, and
          approval status. Record agreements, lane rates, surcharges, and capacity commitments, and
          control when each takes effect.


          Planners always price against current rates, and invoice audit checks against the same
          numbers.
  - id: B1A-COPY-TMS-PROCUREMENT
    summary: Write the approved catalog copy for Freight Procurement.
    finding: >-
      catalog_tagline and catalog_description are empty (A4 or M8, Rule #20). The wording is drafted
      and waits for approval.
    action: >-
      Write these two values once approved, or the user's correction, at record_status='new'. Fill
      empty columns only.
    extra_rows:
      - table: domain_modules
        natural_key: TMS-PROCUREMENT
        field: catalog_tagline
        to: Run freight bids across your lanes and turn the awards into carrier agreements.
      - table: domain_modules
        natural_key: TMS-PROCUREMENT
        field: catalog_description
        to: >-
          Run RFQs and auctions with your carriers, collect their offers lane by lane, and compare
          them side by side. Award the lanes you want and carry the results into agreements and
          rates, so what you negotiated is what planners use.
  - id: B1A-COPY-TMS-SETTLEMENT
    summary: Write the approved catalog copy for Freight Audit and Settlement.
    finding: >-
      catalog_tagline and catalog_description are empty (A4 or M8, Rule #20). The wording is drafted
      and waits for approval.
    action: >-
      Write these two values once approved, or the user's correction, at record_status='new'. Fill
      empty columns only.
    extra_rows:
      - table: domain_modules
        natural_key: TMS-SETTLEMENT
        field: catalog_tagline
        to: >-
          Check every carrier invoice against the shipment and the agreed rate, and pay only what
          you owe.
      - table: domain_modules
        natural_key: TMS-SETTLEMENT
        field: catalog_description
        to: >-
          Match incoming carrier invoices to delivered shipments and contracted rates, and see which
          ones need attention. Work exceptions and disputes with the carrier, allocate cost across
          orders and cost centers, and pass approved invoices to accounts payable.


          File loss and damage claims against carriers and track the dates that matter.
  - id: B1A-COPY-TMS-DOCK
    summary: Write the approved catalog copy for Dock Appointment Scheduling.
    finding: >-
      catalog_tagline and catalog_description are empty (A4 or M8, Rule #20). The wording is drafted
      and waits for approval.
    action: >-
      Write these two values once approved, or the user's correction, at record_status='new'. Fill
      empty columns only.
    extra_rows:
      - table: domain_modules
        natural_key: TMS-DOCK
        field: catalog_tagline
        to: Book dock appointments so trucks arrive when your team is ready for them.
      - table: domain_modules
        natural_key: TMS-DOCK
        field: catalog_description
        to: >-
          Set up your dock doors, hours, and limits, and take appointment requests against the
          calendar. Confirm slots, see who has arrived, and mark loads as finished, so pickups and
          deliveries stop stacking up at the door.
b1b:
  - id: B1B-NEIGHBOR-MODULES
    summary: >-
      Eight consumed records have no module-level master because S2P, OMS, AP-AUTO, and ESG have no
      modules yet (B5, UNOWNED in B9d).
    finding: >-
      sourcing_events, purchase_orders, goods_receipts, and supplier_invoices (S2P),
      order_allocations and inventory_locations (OMS), payment_runs (AP-AUTO), and emission_factors
      (ESG) are mastered only in the legacy domain_data_objects rollup. Health check B5 reads the
      module junction, so it fails here until those domains are modularized. The handoffs to and
      from them also have no module on the far side.
    action: >-
      Report-only. Clears when each neighbor gets its modules. Set target_domain_module_id and
      source_domain_module_id on the handoffs then, and re-run B5.
    blocked_by:
      - type: domain_audit
        blocking_domain: S2P
        milestone: M1
      - type: domain_audit
        blocking_domain: OMS
        milestone: M1
      - type: domain_audit
        blocking_domain: AP-AUTO
        milestone: M1
      - type: domain_audit
        blocking_domain: ESG
        milestone: M1
    affected_entities:
      - sourcing_events
      - purchase_orders
      - goods_receipts
      - supplier_invoices
      - order_allocations
      - inventory_locations
      - payment_runs
      - emission_factors
  - id: B1B-WMS-DOCK
    summary: dock_appointments may move to WMS when that candidate loads.
    finding: >-
      Gartner places yard closer to WMS, and WMS would claim the same dock calendar. WMS is still a
      queue candidate with nothing in the catalog.
    action: Re-check the owner of dock_appointments when WMS is promoted.
    blocked_by:
      - type: catalog_addition
        scope: domains
        trigger: WMS promotion
    affected_entities:
      - dock_appointments
  - id: B1B-HAZMAT-PAIR
    summary: >-
      hazmat_shipping_papers (TMS) and hazmat_load_declarations (TRUCKING-TMS) were not compared in
      research.
    finding: >-
      Both were loaded as separate records. They may hold overlapping data. Neither Phase 0 report
      compared them.
    action: >-
      Compare them when field-level specs are drafted, and surface a merge only if they prove to be
      one record.
    blocked_by:
      - type: depends_on
        ref: field-level spec for either module
        reason: the catalog models no fields
    affected_entities:
      - hazmat_shipping_papers
      - hazmat_load_declarations

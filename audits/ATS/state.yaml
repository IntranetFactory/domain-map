schema_version: 2
domain: ATS
status: feedback_needed
next_action_by: user
last_audit: "2026-11-01"

b1a: []

b1b:
  - id: B1B-B9D-MISTAG-402
    summary: "ATS source mis-tag: handoff #402 (background_check.flagged -> HRSD) tagged 7.4 should re-point to 7.2.5.1 or be deleted (destructive, needs sign-off)"
    finding: >
      Handoff #402 (background_check.flagged -> HRSD) tags 7.4 "Manage employee relations", which
      contradicts the carried entity: a flagged pre-hire check is screening work, realized under
      7.2.5.1 "Obtain candidate background information" (process 1020, gated + process_raci).
      background_checks is now mastered by BGV (BGV-SCREENING-ORDERS, 2026-06-19 build); ATS
      publishes the event from its embedded copy. The re-point target still fits.
      Live: handoff_processes id=226, process_id 42 (7.4), record_status='new'.
    action: "On sign-off: PATCH handoff_processes #226 process_id 42 -> 1020 (7.4 -> 7.2.5.1), or DELETE the 7.4 tag. record_status stays new."
    blocked_by:
      - {type: user_decision, ref: "q-ATS.md q1", reason: "destructive re-point/delete of a handoff_processes tag"}

b2:
  - id: B2-M9-COMPOSED-CHILDREN
    summary: "Six required composition edges point at child records that most ATS modules do not carry (M9 fail on 7 modules); relax the four optional children, embed the two core ones"
    question: >
      Make the four sector- or deployment-optional children not required (candidate_consents,
      fcra_disclosures, interview_panels, applicant_flow_records), and embed the two core children
      where their parent is carried without them (application_stage_transitions in ATS-INTERVIEWS,
      ATS-OFFERS, HIRING-STARTER; offer_versions in ATS-BACKGROUND-CHECKS, ATS-PRE-EMPLOYEE-RECORD,
      HIRING-STARTER)?
    options:
      - "relax 4 + embed 2: set is_required=false on rel 1300, 1310, 1325, 1337; add embedded_master (necessity required) rows for application_stage_transitions and offer_versions on the listed modules"
      - "embed all six on every module that carries the parent (up to 8 modules each), with necessity optional for the four sector children"
      - "relax all six edges; embed nothing"
    why: >
      SKILL.md Rule #16 lists fcra_disclosures and applicant_flow_records (US statutes) and
      candidate_consents (vendor-optional) as optional entities, and not every interview has a panel
      object, so a required composition edge to them is wrong data rather than a missing embed: relaxing
      the edge fixes every module at once. Stage history and offer versions are part of every
      application and offer, so they are embedded. Lacking modules per edge (2026-11-01): 1300 and
      1310 lack in 8 modules; 1315 in ATS-INTERVIEWS, ATS-OFFERS, HIRING-STARTER; 1325 in
      HIRING-STARTER; 1329 in ATS-BACKGROUND-CHECKS, ATS-PRE-EMPLOYEE-RECORD, HIRING-STARTER;
      1337 in ATS-INTERVIEWS, ATS-OFFERS, HIRING-STARTER. Recorded by domain_health.ts (checks: M9).
    affected_entities: [candidate_consents, fcra_disclosures, application_stage_transitions, interview_panels, offer_versions, applicant_flow_records]
    extra_edges:
      - {rel: 1300, edge: "candidates consents_via candidate_consents", owner: ATS-CANDIDATE-CRM}
      - {rel: 1310, edge: "candidates discloses_via fcra_disclosures", owner: BGV-ADJUDICATION-COMPLIANCE}
      - {rel: 1315, edge: "job_applications transitions_via application_stage_transitions", owner: ATS-RECRUITMENT-PIPELINE}
      - {rel: 1325, edge: "interviews convenes interview_panels", owner: ATS-INTERVIEWS}
      - {rel: 1329, edge: "job_offers evolves_through offer_versions", owner: ATS-OFFERS}
      - {rel: 1337, edge: "job_applications logged_via applicant_flow_records", owner: ATS-RECRUITMENT-PIPELINE}

  - id: B2-B7B-USER-EDGES
    summary: "33 users edges are many_to_many references and 2 name two roles in one edge; restructure them into single-person edges (destructive)"
    question: >
      Restructure the users edges as drafted: each many_to_many reference becomes a one_to_many edge
      from users (one person per role, verbs swapped, owner_side source, is_required kept); edge 821
      splits into recruiter and hiring-manager edges; edge 823 keeps one coordinator edge and moves
      panelists to interview_panels (edge 2003 re-verbed "sits on"); edge 900 re-orients so users owns
      the pre-employee record?
    options: ["yes, apply as drafted", "no, keep the edges as they are"]
    why: >
      B7b: a reference to users is one person per foreign key, and a row-scope rule (E6 R8, 40
      findings) needs that single owner. Rows: 821-826, 900, 1339, 1343-1346, 1348, 1349, 1984,
      1985, 1990-1997, 1999-2005, 2269, 2660, 2662 (exact replacements in history.md 2026-11-01).

  - id: B2-B6B-OWNER-SIDE
    summary: "10 one_to_many edges name the child as owner_side; fix each (8 flips, 1 flip plus verb rewrite, 1 re-orientation)"
    question: >
      Apply the drafted owner_side fixes: flip owner_side to source on 810, 812, 813, 814, 1295, 1297,
      1299, 1303; flip and rewrite the forward verb on 1316; re-orient 811 (candidates is the parent:
      candidates is referred through candidate_referrals)?
    options: ["yes, apply as drafted", "no, keep them"]
    why: >
      B6b: owner_side names the parent (the cascade root). Each edge was checked one by one, never a
      blanket flip; 811 already names the true parent but is stored the wrong way round.

  - id: B2-M5-STATE-221
    summary: "job_applications.hired (state 221) is realized on ATS-PRE-EMPLOYEE-RECORD, a module that does not carry job_applications"
    question: "Move the realizer of job_applications.hired to ATS-RECRUITMENT-PIPELINE (the module that masters applications), so the gate becomes ats-recruitment-pipeline:hire_candidate?"
    options: ["yes, set domain_module_id 8 -> 4", "no, keep module 8 and add a job_applications row to it instead"]
    why: "M5 fail: a realizer that does not carry the entity mints a wrong-prefixed permission; it is also the one data failure the architect checker reports on the ats-recruitment-pipeline blueprint."

  - id: B2-E4D-SUBMIT-SCORECARD
    summary: "submit_scorecard gates the interviewer's own action on the Recruiting Manager; remodel as an owner rule"
    question: >
      Stop gating scorecard submission (requires_permission false on interview_scorecards.submitted),
      so each interviewer submits their own scorecard and the scorecard locks once submitted (an owner
      rule the analyst authors at spec time)?
    options: ["yes, drop the gate", "no, keep it gated"]
    why: "E4d: today only the process's Accountable (Recruiting Manager) and admins could submit, so interviewers could not submit their own feedback."

  - id: B2-B9C-EVENT-REPOINTS
    summary: "Four events point at states or entities that do not fit (re-points, destructive)"
    question: >
      Apply the four event fixes: 62 headcount.approved to_state approved -> open (from
      pending_approval); 81 job_offer.signed to_state signed -> accepted, then move handoffs 121 and
      398 onto 80 job_offer.accepted and delete 81; 365 recruitment_source.attributed category
      lifecycle -> signal; 368 / 369 talent_pool.candidate_added / candidate_activated onto
      talent_pool_memberships (to_state cold / hot)?
    options: ["yes, all four", "only 62 and 81", "no"]
    why: >
      B9c / E6 R6: job_requisitions has no approved state (open is the approved, recruiting state);
      job_offers has no signed state and offer_letter_documents.signed already records the signature,
      so a second signed state would duplicate it; recruitment_sources has no lifecycle; the pool's own
      state does not change when a member is added or activated.

  - id: B2-R7-HIRING-STARTER-DESCRIPTION
    summary: "The HIRING-STARTER module description contradicts what the module derives (gates, skill, background checks, pre-employee)"
    question: "Replace the HIRING-STARTER description with the drafted text (q-ATS.md q8)?"
    options: ["yes, use the drafted text", "no, keep the current text"]
    why: "E6 R7 plus review: the current text says no workflow gates (8.1 mints 6), one system skill (skills are domain-grain), no background-check orchestration (it reacts to flagged checks), and no pre-employee reconciliation (an accepted offer hands off to HCM)."

  - id: B2-HS-SOURCE-EDGE
    summary: "recruitment_sources attributes candidates is required, so every candidate must have a source once sources are installed"
    question: "Make the edge recruitment_sources attributes candidates (rel 810) not required, so a candidate can be saved without a known source?"
    options: ["yes, is_required false", "no, keep it required"]
    why: "Inbound and walk-in candidates often have no attributed source at capture. The other flagged pair (interviews is scored via interview_scorecards) is correct as is: a scorecard must belong to an interview."

  - id: B2-B4-PERSONAL-CONTENT
    summary: "Three masters hold owner-scoped personal data but are not flagged has_personal_content"
    question: "Flag candidate_assessments, candidate_referrals and referral_payouts as personal content (row-scoped to their owner, with view-all / manage-all overrides)?"
    options: ["yes, all three", "only candidate_assessments", "no"]
    why: "B4: assessment results, referral submissions and payout amounts are personal data about a candidate or an employee; the flag drives the row-scope rule and the override permissions in blueprints."

  - id: B2-HIGH-RISK-GATES
    summary: "No ATS gate is marked high-risk; three are hiring decisions or financial commitments"
    question: "Mark approve_offer (states 226, 1230), hire_candidate (206, 221) and approve_requisition (238, 1200) as high-risk, so under business-roles access only the Accountable role can take them (admins cannot step in)?"
    options: ["yes, all three", "only approve_offer and hire_candidate", "no"]
    why: "Gate permission model: high-risk is for financial approvals, compliance sign-offs and hiring decisions. It has no effect at the admin-only access level."

  - id: B2-R18-VENDOR-NAMES
    summary: "Three data_object descriptions name vendors or products (Rule #18)"
    question: "Replace the descriptions of job_posting_distributions (886), interview_kits (890) and interviewer_availability_slots (894) with the drafted vendor-free text (q-ATS.md q12)?"
    options: ["yes", "no"]
    why: "Rule #18: vendor and product names belong only on commerce-shaped entities."

  - id: B2-MO1-BACKGROUND-CHECKS-MODULE
    summary: "ATS-BACKGROUND-CHECKS masters nothing since BGV took the screening entities; keep, rename or fold"
    question: "What should ATS-BACKGROUND-CHECKS be, now that BGV masters every screening entity?"
    options:
      - "keep it as the standalone screening shell (orders and tracks screening, defers to BGV when installed)"
      - "keep it and rename it to say it orders and tracks screening"
      - "fold it into ATS-OFFERS (screening is ordered when an offer is accepted)"
    evidence: >
      Greenhouse, Lever, Ashby, SmartRecruiters and iCIMS all run background screening through a
      partner integration and master no screening record of their own (verified 2026-11-01 from their
      API object lists; iCIMS product-level). The 2026-06-19 BGV build moved the 11 screening entities
      to BGV, leaving ATS-BACKGROUND-CHECKS with 0 masters and 12 embedded copies; it still holds
      gates 190 (7.2.5.1) and 191 (7.2.4), which several ATS boundary payloads resolve through.
      No ATS -> BGV handoff exists.
    why: "A full module with no masters is a modularization smell, but the embedded copies are exactly the integration point the vendors show; folding would move gates 190 / 191 and their RACI realizations."

  - id: B2-S1-RECRUITER-INTERACTIONS
    summary: "recruiter_interactions (869) duplicates candidate_notes (1001)"
    question: "Merge recruiter_interactions into candidate_notes (move its relationships, delete 869)?"
    options: ["yes, merge", "no, re-scope recruiter_interactions instead", "no, keep both"]
    evidence: "Greenhouse, Lever, Ashby and SmartRecruiters each model a single notes object on the candidate; none separates recruiter interactions from notes (API object lists, 2026-11-01)."
    why: "Two masters with the same definition split one record type across the module."

  - id: B2-S2-NURTURE-VS-SEQUENCES
    summary: "candidate_nurture_campaigns (867) duplicates outreach_sequences (1259)"
    question: "Merge candidate_nurture_campaigns into outreach_sequences?"
    options: ["yes, merge", "no, re-describe 867 as the audience enrolled into a sequence", "no, keep both"]
    evidence: "Ashby models one sequence object; Lever calls the same object a nurture campaign; Greenhouse and SmartRecruiters each have one campaign / sequence object (2026-11-01)."
    why: "The 2026-06-16 outreach_sequences load introduced the second object for the same thing."

  - id: B2-M1-MESSAGE-TEMPLATES
    summary: "No entity for candidate message templates, though sequences and emails reference one"
    question: "How should ATS model candidate message templates?"
    options:
      - "mint candidate_message_templates as an ATS-CANDIDATE-CRM master (catalog, optional)"
      - "reuse notification_templates (961, mastered by LMS-AUTOMATION) as an embedded copy"
      - "leave them out"
    evidence: "Greenhouse (Email Templates), Ashby (communicationTemplate) and SmartRecruiters (Message Templates) each master candidate message templates inside the ATS (2026-11-01); outreach_sequence_steps and candidate_emails already reference a template with no entity."
    why: "notification_templates is a generic LMS-mastered object; candidate messaging belongs with the candidate CRM."

  - id: B2-M3-AI-MATCHING
    summary: "The AI-Driven Matching and Screening capability has no entity behind it"
    question: "Give ATS-CANDIDATE-CRM optional embedded copies of fit_scores (862) and match_inference_runs (865), mastered by TLNT-INTEL-MOBILITY, and keep PA's per-employee predictive_models out of ATS (PA re-points or retires handoff 453)?"
    options: ["yes", "embed fit_scores only", "no"]
    evidence: "All five ATS vendors keep a match or fit score on the application (2026-11-01); EU AI Act Art. 12 and 26(6) require logging of high-risk AI decisions, which match_inference_runs records. TLNT-INTEL-MOBILITY already masters both entities."
    why: "Reuses the catalog's existing scoring masters instead of minting a second scoring model in ATS."

  - id: B2-M10-PAY-RANGES
    summary: "Pay transparency: postings and offers need the salary band, removed from ATS on 2026-05-28"
    question: "Re-add salary_bands (154) as an optional consumer on ATS-OFFERS and ATS-RECRUITMENT-PIPELINE (this reverses the 2026-05-28 removal)?"
    options: ["yes", "no, keep it removed"]
    evidence: "Lever postings carry salaryRange and Ashby postings carry compensation (2026-11-01); the EU Pay Transparency Directive (mandatory on ATS) requires a pay range before the interview. Re-adding also fixes the consumer leg of inbound handoff 425."
    why: "The 2026-05-28 removal predates the pay-transparency regulation link on ATS."

  - id: B2-X2-BENADMIN-H395
    summary: "Handoff 395 to BEN-ADMIN carries candidates, which BEN-ADMIN does not consume"
    question: "Re-point handoff 395's payload from candidates to benefit_enrollments (147), keeping its 7.5.2.2 tag?"
    options: ["yes", "no"]
    why: "Phase 1 consumer leg fails: the benefits side reads the enrollment it opens, not the candidate record."

  - id: B2-X4-BGV-PUBLISHER
    summary: "Handoffs 401 / 402 publish background_check events from ATS, but BGV now masters background_checks"
    question: "Move the publisher of handoffs 401 and 402 to BGV (source domain 191, module BGV-SCREENING-ORDERS / BGV-ADJUDICATION-COMPLIANCE), or keep ATS publishing from its embedded copy?"
    options: ["move to BGV", "keep ATS as the publisher"]
    why: "Pairwise Phase 1, leg 1: the event's entity is mastered on the target side of the 2026-06-19 BGV build. Keeping ATS is valid only while ATS-BACKGROUND-CHECKS stays the standalone shell (see B2-MO1)."

b3:
  - id: B3-M4-AI-SCREENING-COMPLIANCE
    candidate: "automated_screening_notices, ai_screening_bias_audits"
    rationale: >
      NYC Local Law 144, EU AI Act Art. 26(11), Illinois AIVIA and the Colorado AI Act require notices
      to candidates about automated screening and periodic bias audits; EU-AI-ACT is mandatory on ATS
      and the catalog has no home for either record. Not a b2 yet: needs a Phase 0 vendor surface (which
      ATS flagships model the notice and the audit) before the home (ATS master vs a future AI-governance
      domain) can be decided.
    vendor_evidence: []
  - id: B3-M5-CANDIDATE-SURVEYS
    candidate: candidate_experience_surveys
    rationale: "Ashby survey API and Greenhouse surveys model candidate experience surveys."
    vendor_evidence: [Ashby, Greenhouse]
  - id: B3-M6-JOB-TEMPLATES
    candidate: job_templates
    rationale: "Ashby jobTemplate and Greenhouse template jobs."
    vendor_evidence: [Ashby, Greenhouse]
  - id: B3-M7-INTERVIEW-TRANSCRIPTS
    candidate: interview_transcripts
    rationale: "Ashby notetakerTranscript; supersedes the deferred video_interview_sessions idea."
    vendor_evidence: [Ashby]
  - id: B3-M8-CANDIDATE-HISTORY
    candidate: "candidate education and employment history"
    rationale: "Greenhouse Education API, SmartRecruiters and iCIMS model it; decide entity vs structured field."
    vendor_evidence: [Greenhouse, SmartRecruiters, iCIMS]
  - id: B3-M9-RECRUITING-AUDIT-EVENTS
    candidate: recruiting_audit_events
    rationale: "Lever Audit Events, Ashby auditLog and SmartRecruiters Audit API; check whether the platform audit trail already covers it first."
    vendor_evidence: [Lever, Ashby, SmartRecruiters]
  - id: B3-REFERRAL-BONUS-PATH
    candidate: "single path for referral bonuses to payroll"
    rationale: "Referral bonuses reach payroll two ways: handoff 404 (candidate_referral.bonus_earned) and today's 1541 (referral_payout.approved); moving 404 onto the payout event would leave one path."
    vendor_evidence: []


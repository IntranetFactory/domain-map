b1b:
  - id: B1B-FLEET-COMPLIANCE-RECORDS
    summary: Records this domain reads but FLEET-MGMT should own do not exist yet.
    finding: >-
      Phase 0 assigns driver_qualification_records (49 CFR 391.51), clearinghouse_queries (49 CFR
      382.701), and ucr_registrations (49 USC 14504a, low confidence) to FLEET-MGMT, because private
      fleets owe them too. toll_transactions and vehicle_permits are FLEET-MGMT candidates on vendor
      evidence. None exists in the catalog. The regulations are seeded and tagged here.
    action: >-
      Report-only here. Raise on the next FLEET-MGMT audit; this domain is a consumer once they
      exist.
    blocked_by:
      - type: domain_audit
        blocking_domain: FLEET-MGMT
        milestone: carrier compliance records
    affected_entities:
      - driver_qualification_records
      - clearinghouse_queries
      - ucr_registrations
      - toll_transactions
      - vehicle_permits
  - id: B1B-ELD-COMPLIANCE-OVERLAP
    summary: The ELD-COMPLIANCE candidate overlaps live owners, and EU tachograph records have no owner.
    finding: >-
      ELD-COMPLIANCE claims hours of service, DVIR, and IFTA. Live data gives eld_logs to TELEMATICS
      and vehicle_inspections to FLEET-MGMT, and ifta_quarterly_returns now sits in FLEET-MGMT.
      tachograph_records and driving_rest_records belong to TELEMATICS or ELD-COMPLIANCE, and this
      domain only consumes them. They were not loaded.
    action: >-
      Report-only here. Settle when ELD-COMPLIANCE gets its point-solution review, including whether
      IFTA moves.
    blocked_by:
      - type: catalog_addition
        scope: domains
        trigger: ELD-COMPLIANCE point-solution review
    affected_entities:
      - eld_logs
      - vehicle_inspections
      - ifta_quarterly_returns
      - tachograph_records
      - driving_rest_records
  - id: B1B-DRAYAGE-RECHECK
    summary: Drayage was loaded as a module on marketing evidence, and may still pass as its own domain.
    finding: >-
      The user chose a domain module over install-optional records. PortPro drayOS and CargoWise
      Landside are specialists, and only marketing pages were read, so the three masters are a first
      cut. Specialist records terminal_appointments, plus LTL interline_partner_splits and
      tank_wash_records, were skipped.
    action: >-
      Re-check against a schema if a drayage vendor publishes one. Surface a promotion to its own
      domain only with that evidence.
    blocked_by:
      - type: depends_on
        ref: drayage vendor schema
        reason: marketing evidence only so far
    affected_entities:
      - intermodal_containers
      - container_per_diem_charges
      - chassis_usages
  - id: B1B-PLATFORM-SCIENCE
    summary: Platform Science, which now owns Trimble's telematics units, is not in the catalog.
    finding: >-
      The Trimble Transportation row no longer claims those units, so TELEMATICS may be missing a
      vendor. Adding it was not part of the approved answers.
    action: Raise on the next TELEMATICS audit.
    blocked_by:
      - type: domain_audit
        blocking_domain: TELEMATICS
        milestone: solutions refresh

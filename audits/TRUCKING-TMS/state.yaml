  - id: B1A-COPY-DOMAIN
    summary: Write the approved catalog copy for Trucking Transportation Management.
    finding: >-
      catalog_tagline and catalog_description are empty (A4 or M8, Rule #20). The wording is drafted
      and waits for approval.
    action: >-
      Write these two values once approved, or the user's correction, at record_status='new'. Fill
      empty columns only.
    extra_rows:
      - table: domains
        natural_key: TRUCKING-TMS
        field: catalog_tagline
        to: >-
          Run your trucking company from one system: book loads, dispatch trucks, bill customers,
          and settle with drivers.
      - table: domains
        natural_key: TRUCKING-TMS
        field: catalog_description
        to: >-
          Take loads from customers by phone, email, or EDI, and plan them onto your trucks. Assign
          drivers and equipment, see who is available, and keep customers updated as freight moves.
          When a load delivers, rate it, pull the paperwork together, and get the invoice out the
          same day.


          Pay drivers and owner-operators correctly, with deductions and escrow handled. Add partner
          carriers when your own trucks are full, and switch on less-than-truckload or drayage when
          your business runs them.
